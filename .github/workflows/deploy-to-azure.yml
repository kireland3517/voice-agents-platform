name: Deploy Voice Agents Platform to Azure

# ============================================================================
# DEPLOYMENT WORKFLOW
# ============================================================================
# This workflow handles automated deployment of the voice agents platform to
# Azure Container Apps with comprehensive testing, multi-environment support,
# and automated rollback capabilities.
#
# Environments:
# - staging: Auto-deploys on push to 'develop' or 'feature/*' branches
# - production: Auto-deploys on push to 'main' branch, requires approval
# ============================================================================

on:
  # Automated triggers
  push:
    branches:
      - main              # Production deployment
      - develop           # Staging deployment
      - feature/*         # Feature branch testing
      - claude-edits      # Current active branch
    paths:
      - '**.py'           # Python source files
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-to-azure.yml'
      - 'config.py'
      - 'app.py'
      - 'sarah_instructions_senior_life.md'  # Sarah prompt (auto-synced to Blob Storage)

  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip automated tests (not recommended)'
        required: false
        type: boolean
        default: false

  # PR validation (build + test only, no deployment)
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Dockerfile'

env:
  PYTHON_VERSION: '3.12'
  REGISTRY_URL: voiceagentsenvironmentf2c46d.azurecr.io
  CONTAINER_APP_NAME: voice-agents-bridge
  RESOURCE_GROUP: voice_agents

# ============================================================================
# JOBS
# ============================================================================

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: CODE QUALITY & LINTING
  # --------------------------------------------------------------------------
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint

      - name: Run Black (code formatting check)
        run: black --check --diff .
        continue-on-error: true  # Don't fail on formatting issues

      - name: Run isort (import sorting check)
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Run Flake8 (linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run Pylint (static analysis)
        run: |
          pylint --exit-zero --disable=all --enable=E,F app.py config.py
        continue-on-error: true

  # --------------------------------------------------------------------------
  # JOB 2: SECURITY SCANNING
  # --------------------------------------------------------------------------
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit (security linter)
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety (dependency vulnerability check)
        run: |
          pip install safety
          safety check --json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  # --------------------------------------------------------------------------
  # JOB 3: AUTOMATED TESTING
  # --------------------------------------------------------------------------
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run unit tests
        run: |
          # Create basic test structure if tests don't exist
          if [ ! -d "tests" ]; then
            echo "No tests directory found. Tests will be added in future iterations."
            exit 0
          fi
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
        continue-on-error: true  # Don't fail if no tests exist yet

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  # --------------------------------------------------------------------------
  # JOB 4: BUILD & PUSH DOCKER IMAGE
  # --------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.VOICEAGENTSBRIDGE_REGISTRY_USERNAME }}
          password: ${{ secrets.VOICEAGENTSBRIDGE_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.CONTAINER_APP_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_URL }}/${{ env.CONTAINER_APP_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_URL }}/${{ env.CONTAINER_APP_NAME }}:buildcache,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  # --------------------------------------------------------------------------
  # JOB 5: DEPLOY TO STAGING
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      (github.ref == 'refs/heads/develop' ||
       startsWith(github.ref, 'refs/heads/feature/') ||
       github.ref == 'refs/heads/claude-edits' ||
       github.event.inputs.environment == 'staging') &&
      github.event_name != 'pull_request'

    environment:
      name: staging
      url: https://voice-agents-bridge-staging.azurecontainerapps.io

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy to Azure Container Apps (Staging)
        run: |
          # Extract the first tag from the build job output
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          IMAGE=$(echo "$IMAGE_TAG" | head -n1)

          echo "Deploying image: $IMAGE"

          # Check if container app exists
          if az containerapp show -n ${{ env.CONTAINER_APP_NAME }}-staging -g ${{ env.RESOURCE_GROUP }} > /dev/null 2>&1; then
            echo "Updating existing container app..."
            az containerapp update \
              -n ${{ env.CONTAINER_APP_NAME }}-staging \
              -g ${{ env.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --set-env-vars \
                ENVIRONMENT=staging \
                LOG_LEVEL=DEBUG \
                ENABLE_DETAILED_LOGGING=true
          else
            echo "Creating new container app..."
            az containerapp create \
              -n ${{ env.CONTAINER_APP_NAME }}-staging \
              -g ${{ env.RESOURCE_GROUP }} \
              --image "$IMAGE" \
              --environment voice-agents-env \
              --registry-server ${{ env.REGISTRY_URL }} \
              --registry-username ${{ secrets.VOICEAGENTSBRIDGE_REGISTRY_USERNAME }} \
              --registry-password ${{ secrets.VOICEAGENTSBRIDGE_REGISTRY_PASSWORD }} \
              --target-port 8000 \
              --ingress external \
              --env-vars \
                ENVIRONMENT=staging \
                LOG_LEVEL=DEBUG \
                ENABLE_DETAILED_LOGGING=true \
              --cpu 0.5 \
              --memory 1.0Gi \
              --min-replicas 1 \
              --max-replicas 3
          fi

      - name: Deployment verification (Staging)
        run: |
          echo "Waiting 30 seconds for staging deployment to stabilize..."
          sleep 30

          # Check if app is responding
          STAGING_URL="https://voice-agents-bridge-staging.azurecontainerapps.io/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL || echo "000")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Staging deployment successful! Health check passed."
          else
            echo "⚠️ Staging deployment may have issues. Health check returned: $HTTP_STATUS"
            exit 1
          fi

      - name: Upload instructions to Blob Storage (Staging)
        run: |
          echo "Uploading sarah_instructions_senior_life.md to staging Blob Storage..."
          az storage blob upload \
            --account-name voiceagentsstorage \
            --container-name company-configs \
            --name senior-life/instructions.md \
            --file sarah_instructions_senior_life.md \
            --auth-mode login \
            --overwrite \
            || echo "⚠️ Blob upload failed - may need manual upload via portal"

  # --------------------------------------------------------------------------
  # JOB 6: DEPLOY TO PRODUCTION
  # --------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      (github.ref == 'refs/heads/main' ||
       github.event.inputs.environment == 'production') &&
      github.event_name != 'pull_request'

    environment:
      name: production
      url: https://voice-agents-bridge.azurecontainerapps.io

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Get current revision (for rollback)
        id: current-revision
        run: |
          CURRENT_REVISION=$(az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv || echo "")
          echo "current-revision=$CURRENT_REVISION" >> $GITHUB_OUTPUT
          echo "Current production revision: $CURRENT_REVISION"

      - name: Deploy to Azure Container Apps (Production)
        id: deploy-production
        run: |
          # Extract the first tag from the build job output
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          IMAGE=$(echo "$IMAGE_TAG" | head -n1)

          echo "Deploying image: $IMAGE"

          az containerapp update \
            -n ${{ env.CONTAINER_APP_NAME }} \
            -g ${{ env.RESOURCE_GROUP }} \
            --image "$IMAGE" \
            --set-env-vars \
              ENVIRONMENT=production \
              LOG_LEVEL=INFO \
              ENABLE_DETAILED_LOGGING=false

      - name: Deployment verification (Production)
        id: verify
        run: |
          echo "Waiting 60 seconds for production deployment to stabilize..."
          sleep 60

          # Check if app is responding
          PROD_URL="https://voice-agents-bridge.azurecontainerapps.io/health"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $PROD_URL || echo "000")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Production deployment successful! Health check passed."
            echo "deployment-status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Production deployment failed! Health check returned: $HTTP_STATUS"
            echo "deployment-status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.current-revision.outputs.current-revision != ''
        run: |
          echo "⚠️ Deployment failed! Rolling back to previous revision..."
          az containerapp revision set-mode \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --mode single

          az containerapp revision activate \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision ${{ steps.current-revision.outputs.current-revision }}

          echo "✅ Rollback completed to revision: ${{ steps.current-revision.outputs.current-revision }}"

      - name: Upload instructions to Blob Storage (Production)
        if: steps.verify.outputs.deployment-status == 'success'
        run: |
          echo "Uploading sarah_instructions_senior_life.md to production Blob Storage..."
          az storage blob upload \
            --account-name voiceagentsstorage \
            --container-name company-configs \
            --name senior-life/instructions.md \
            --file sarah_instructions_senior_life.md \
            --auth-mode login \
            --overwrite \
            || echo "⚠️ Blob upload failed - may need manual upload via portal"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.verify.outputs.deployment-status == 'success'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## Production Deployment - v${{ github.run_number }}

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Deployed by:** ${{ github.actor }}
            **Deployment time:** ${{ github.event.head_commit.timestamp }}

            ### Changes in this release:
            ${{ github.event.head_commit.message }}

            ### Docker Image:
            `${{ env.REGISTRY_URL }}/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}`

            ### Verification:
            - Health check: ✅ Passed
            - Deployment status: ✅ Successful
          draft: false
          prerelease: false

  # --------------------------------------------------------------------------
  # JOB 7: POST-DEPLOYMENT NOTIFICATIONS
  # --------------------------------------------------------------------------
  notify:
    name: Send Deployment Notifications
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "✅ **Staging deployment:** Successful" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-staging.result }}" == "skipped" ]; then
            echo "⏭️ **Staging deployment:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Staging deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ **Production deployment:** Successful" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-production.result }}" == "skipped" ]; then
            echo "⏭️ **Production deployment:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Production deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

      # Optional: Send notification to Slack, Teams, email, etc.
      # - name: Send Slack notification
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     payload: |
      #       {
      #         "text": "Deployment completed for voice-agents-platform"
      #       }
