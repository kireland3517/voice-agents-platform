name: Trigger auto deployment for voice-agents-bridge

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ claude-edits ]
    paths:
    - '**'
    - '.github/workflows/voice-agents-bridge-AutoDeployTrigger-75c7d92f-8a04-42af-a2ba-d210e2b9a862.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.VOICEAGENTSBRIDGE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: voiceagentsenvironmentf2c46d.azurecr.io
          registryUsername: ${{ secrets.VOICEAGENTSBRIDGE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.VOICEAGENTSBRIDGE_REGISTRY_PASSWORD }}
          containerAppName: voice-agents-bridge
          resourceGroup: voice_agents
          imageToBuild: voiceagentsenvironmentf2c46d.azurecr.io/voice-agents-bridge:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


