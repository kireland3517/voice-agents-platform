name: Deploy Quality Monitoring Branch to Azure

on:
  push:
    branches:
      - feature/acs-quality-monitoring
  workflow_dispatch: # Allow manual trigger

env:
  AZURE_CONTAINER_APP_NAME: voice-agents-bridge
  AZURE_RESOURCE_GROUP: voice_agents

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: feature/acs-quality-monitoring

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run quality monitoring tests
      run: |
        python test_quality_monitoring.py

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp up \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --source .

    - name: Verify deployment
      run: |
        echo "Deployment complete! Quality monitoring is now active."
        echo "Check logs with:"
        echo "  az containerapp logs show -n ${{ env.AZURE_CONTAINER_APP_NAME }} -g ${{ env.AZURE_RESOURCE_GROUP }}"
